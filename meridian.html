<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    <title>十二經絡與特定穴特訓</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 16px 0 32px 0;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 22px 18px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 92%;
            max-width: 520px;
            box-sizing: border-box;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .badge {
            background-color: #e8f4fd;
            color: #2980b9;
            font-size: 0.85rem;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
        }
        .meridian-title {
            font-size: 1.6rem;
            font-weight: bold;
            color: #2c3e50;
            text-align: center;
            margin: 8px 0 18px 0;
            padding-bottom: 12px;
            border-bottom: 2px solid #eef2f5;
        }
        .quiz-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 14px;
            margin-bottom: 20px;
        }
        .quiz-item {
            display: flex;
            flex-direction: column;
        }
        .quiz-item.full-width {
            grid-column: span 2;
        }
        .quiz-label {
            font-size: 0.9rem;
            font-weight: bold;
            color: #555;
            margin-bottom: 5px;
        }
        select {
            width: 100%;
            padding: 10px 8px;
            font-size: 1rem;
            border: 2px solid #dce4ec;
            border-radius: 8px;
            background-color: #fff;
            color: #2c3e50;
            font-family: inherit;
            appearance: auto;
            transition: border-color 0.2s, background-color 0.2s;
        }
        select:focus {
            outline: none;
            border-color: #3498db;
        }
        select.correct {
            border-color: #27ae60;
            background-color: #eafaf1;
            color: #1e8449;
            font-weight: bold;
        }
        select.wrong {
            border-color: #e74c3c;
            background-color: #fdedec;
            color: #c0392b;
            font-weight: bold;
        }
        .correction {
            font-size: 0.85rem;
            color: #e74c3c;
            font-weight: bold;
            margin-top: 4px;
            min-height: 18px;
        }
        .score-banner {
            display: none;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 16px;
        }
        .score-high {
            background-color: #eafaf1;
            color: #1e8449;
            border: 1px solid #a9dfbf;
        }
        .score-low {
            background-color: #fef9e7;
            color: #b7950b;
            border: 1px solid #f9e79f;
        }
        .action-btn {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .action-btn:hover {
            background-color: #1f6391;
        }
        #nextBtn {
            background-color: #27ae60;
            display: none;
        }
        #nextBtn:hover {
            background-color: #219150;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #7f8c8d;
            text-decoration: none;
            font-size: 0.95rem;
        }
        .back-link:hover {
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-row">
            <span class="badge">十二正經・特定穴特訓</span>
            <span id="progressText" class="badge" style="background:#f0f3f4; color:#555;">1 / 12</span>
        </div>

        <div id="meridianName" class="meridian-title">載入中...</div>

        <div class="quiz-grid" id="quizContainer">
            <!-- 由 JS 動態生成 10 條下拉選單 -->
        </div>

        <div id="scoreBanner" class="score-banner"></div>

        <button id="checkBtn" class="action-btn" onclick="checkAnswers()">核對答案 ✅</button>
        <button id="nextBtn" class="action-btn" onclick="loadNextMeridian()">下一條經絡 ➔</button>

        <a href="index.html" class="back-link" onclick="event.preventDefault(); window.location.href='index.html';">← 返回主選單</a>
    </div>

    <script>
        const meridians = [
            {
                name: "手太陰肺經",
                direction: "胸走手",
                next: "手陽明大腸經",
                jing: "少商", ying: "魚際", shu: "太淵", jing2: "經渠", he: "尺澤",
                yuan: "太淵", luo: "列缺", xi: "孔最"
            },
            {
                name: "手陽明大腸經",
                direction: "手走頭",
                next: "足陽明胃經",
                jing: "商陽", ying: "二間", shu: "三間", jing2: "陽溪", he: "曲池",
                yuan: "合谷", luo: "偏歷", xi: "溫溜"
            },
            {
                name: "足陽明胃經",
                direction: "頭走足",
                next: "足太陰脾經",
                jing: "厲兌", ying: "內庭", shu: "陷谷", jing2: "解溪", he: "足三里",
                yuan: "衝陽", luo: "豐隆", xi: "梁丘"
            },
            {
                name: "足太陰脾經",
                direction: "足走腹（胸）",
                next: "手少陰心經",
                jing: "隱白", ying: "大都", shu: "太白", jing2: "商丘", he: "陰陵泉",
                yuan: "太白", luo: "公孫", xi: "地機"
            },
            {
                name: "手少陰心經",
                direction: "胸走手",
                next: "手太陽小腸經",
                jing: "少衝", ying: "少府", shu: "神門", jing2: "靈道", he: "少海",
                yuan: "神門", luo: "通里", xi: "陰郄"
            },
            {
                name: "手太陽小腸經",
                direction: "手走頭",
                next: "足太陽膀胱經",
                jing: "少澤", ying: "前谷", shu: "後溪", jing2: "陽谷", he: "小海",
                yuan: "腕骨", luo: "支正", xi: "養老"
            },
            {
                name: "足太陽膀胱經",
                direction: "頭走足",
                next: "足少陰腎經",
                jing: "至陰", ying: "足通谷", shu: "束骨", jing2: "崑崙", he: "委中",
                yuan: "京骨", luo: "飛揚", xi: "金門"
            },
            {
                name: "足少陰腎經",
                direction: "足走腹（胸）",
                next: "手厥陰心包經",
                jing: "湧泉", ying: "然谷", shu: "太溪", jing2: "復溜", he: "陰谷",
                yuan: "太溪", luo: "大鍾", xi: "水泉"
            },
            {
                name: "手厥陰心包經",
                direction: "胸走手",
                next: "手少陽三焦經",
                jing: "中衝", ying: "勞宮", shu: "大陵", jing2: "間使", he: "曲澤",
                yuan: "大陵", luo: "內關", xi: "郄門"
            },
            {
                name: "手少陽三焦經",
                direction: "手走頭",
                next: "足少陽膽經",
                jing: "關衝", ying: "液門", shu: "中渚", jing2: "支溝", he: "天井",
                yuan: "陽池", luo: "外關", xi: "會宗"
            },
            {
                name: "足少陽膽經",
                direction: "頭走足",
                next: "足厥陰肝經",
                jing: "足竅陰", ying: "俠溪", shu: "足臨泣", jing2: "陽輔", he: "陽陵泉",
                yuan: "丘墟", luo: "光明", xi: "外丘"
            },
            {
                name: "足厥陰肝經",
                direction: "足走腹（胸）",
                next: "手太陰肺經",
                jing: "大敦", ying: "行間", shu: "太衝", jing2: "中封", he: "曲泉",
                yuan: "太衝", luo: "蠡溝", xi: "中都"
            }
        ];

        const fields = [
            { key: "direction", label: "1. 流注方向", full: false },
            { key: "next", label: "2. 下一條經絡", full: false },
            { key: "jing", label: "3. 井穴", full: false },
            { key: "ying", label: "4. 滎穴", full: false },
            { key: "shu", label: "5. 輸穴", full: false },
            { key: "jing2", label: "6. 經穴", full: false },
            { key: "he", label: "7. 合穴", full: false },
            { key: "yuan", label: "8. 原穴", full: false },
            { key: "luo", label: "9. 絡穴", full: false },
            { key: "xi", label: "10. 郄穴", full: false }
        ];

        let deck = [];
        let currentMeridian = null;
        let completedCount = 0;

        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function getOptionsForField(key, correctAnswer) {
            const allValues = [...new Set(meridians.map(m => m[key]))];
            const distractors = shuffleArray(allValues.filter(v => v !== correctAnswer)).slice(0, 3);
            return shuffleArray([correctAnswer, ...distractors]);
        }

        function loadNextMeridian() {
            if (deck.length === 0) {
                deck = shuffleArray(meridians);
                completedCount = 0;
            }
            currentMeridian = deck.pop();
            completedCount++;

            document.getElementById("meridianName").textContent = currentMeridian.name;
            document.getElementById("progressText").textContent = `${completedCount} / 12`;

            const container = document.getElementById("quizContainer");
            container.innerHTML = "";

            fields.forEach(field => {
                const options = getOptionsForField(field.key, currentMeridian[field.key]);
                const itemDiv = document.createElement("div");
                itemDiv.className = "quiz-item" + (field.full ? " full-width" : "");

                let optionsHtml = `<option value="">-- 請選擇 --</option>`;
                options.forEach(opt => {
                    optionsHtml += `<option value="${opt}">${opt}</option>`;
                });

                itemDiv.innerHTML = `
                    <label class="quiz-label" for="sel_${field.key}">${field.label}</label>
                    <select id="sel_${field.key}" data-key="${field.key}">
                        ${optionsHtml}
                    </select>
                    <div id="corr_${field.key}" class="correction"></div>
                `;
                container.appendChild(itemDiv);
            });

            document.getElementById("scoreBanner").style.display = "none";
            document.getElementById("checkBtn").style.display = "block";
            document.getElementById("nextBtn").style.display = "none";
        }

        function checkAnswers() {
            let score = 0;
            fields.forEach(field => {
                const selectEl = document.getElementById(`sel_${field.key}`);
                const corrEl = document.getElementById(`corr_${field.key}`);
                const correctAns = currentMeridian[field.key];

                selectEl.disabled = true;
                if (selectEl.value === correctAns) {
                    selectEl.classList.add("correct");
                    corrEl.textContent = "";
                    score++;
                } else {
                    selectEl.classList.add("wrong");
                    corrEl.textContent = `正解：${correctAns}`;
                }
            });

            const banner = document.getElementById("scoreBanner");
            banner.style.display = "block";
            if (score === 10) {
                banner.className = "score-banner score-high";
                banner.textContent = `🎉 滿分 10 / 10！呢條經絡完全掌握！`;
            } else if (score >= 7) {
                banner.className = "score-banner score-high";
                banner.textContent = `👍 得分：${score} / 10，差少少就滿分！`;
            } else {
                banner.className = "score-banner score-low";
                banner.textContent = `💪 得分：${score} / 10，留意紅字正解再強化！`;
            }

            document.getElementById("checkBtn").style.display = "none";
            document.getElementById("nextBtn").style.display = "block";
        }

        window.onload = loadNextMeridian;
    </script>
</body>
</html>
