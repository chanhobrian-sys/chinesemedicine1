<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>十二正經 導航特訓</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #eef2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        h1 { font-size: 1rem; color: #7f8c8d; margin-bottom: 5px; }
        h2 { font-size: 2.2rem; color: #2980b9; margin: 0 0 20px; letter-spacing: 2px; }
        
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; }
        input {
            width: 100%; padding: 12px; border: 1px solid #ccc; 
            border-radius: 6px; box-sizing: border-box; font-size: 1rem;
            transition: all 0.3s;
        }
        
        input.correct { border-color: #27ae60; background-color: #e9f7ef; color: #27ae60; font-weight: bold;}
        input.wrong { border-color: #e74c3c; background-color: #fceae8; color: #e74c3c; }
        
        .answer-reveal { font-size: 0.9rem; color: #e74c3c; margin-top: 5px; display: none; }
        
        .action-btn {
            background-color: #2980b9; color: white; border: none; 
            padding: 14px 20px; border-radius: 6px; font-size: 1.1rem; 
            cursor: pointer; width: 100%; margin-top: 15px; font-weight: bold;
        }
        .action-btn:hover { background-color: #2471a3; }
        
        #nextBtn { background-color: #27ae60; display: none; }
        #nextBtn:hover { background-color: #2ecc71; }
        
        #feedback { margin-top: 15px; font-weight: bold; font-size: 1.1rem; min-height: 24px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>經絡循行與特定穴提取</h1>
        <h2 id="meridianName">載入中...</h2>

        <div class="input-group">
            <label for="inputDirection">走向 (填寫：胸走手/手走頭/頭走足/足走腹)</label>
            <input type="text" id="inputDirection" autocomplete="off" placeholder="例如：胸走手">
            <div id="ansDirection" class="answer-reveal"></div>
        </div>

        <div class="input-group">
            <label for="inputJingWell">井穴 (經氣所出)</label>
            <input type="text" id="inputJingWell" autocomplete="off" placeholder="例如：少商">
            <div id="ansJingWell" class="answer-reveal"></div>
        </div>

        <div class="input-group">
            <label for="inputNext">交接經脈 (流注下一條)</label>
            <input type="text" id="inputNext" autocomplete="off" placeholder="例如：手陽明大腸經">
            <div id="ansNext" class="answer-reveal"></div>
        </div>

        <div id="feedback"></div>
        <button id="submitBtn" class="action-btn" onclick="checkAnswers()">驗證導航</button>
        <button id="nextBtn" class="action-btn" onclick="loadMeridian()">下一條經脈 ➔</button>
    </div>

    <script>
        // 1. 十二正經資料庫 (已經將手陽明大腸經的空白錯誤修正)
        const meridianDatabase = [
            { name: "手太陰肺經", direction: "胸走手", jingWell: "少商", next: "手陽明大腸經" },
            { name: "手陽明大腸經", direction: "手走頭", jingWell: "商陽", next: "足陽明胃經" },
            { name: "足陽明胃經", direction: "頭走足", jingWell: "厲兌", next: "足太陰脾經" },
            { name: "足太陰脾經", direction: "足走腹", jingWell: "隱白", next: "手少陰心經" },
            { name: "手少陰心經", direction: "胸走手", jingWell: "少衝", next: "手太陽小腸經" }
        ];

        let currentMeridian = {};

        function cleanString(str) {
            return str.replace(/[ 、，,]/g, "").trim();
        }

        // 2. 隨機抽題邏輯
        function loadMeridian() {
            const randomIndex = Math.floor(Math.random() * meridianDatabase.length);
            currentMeridian = meridianDatabase[randomIndex];
            document.getElementById("meridianName").textContent = currentMeridian.name;

            const inputs = ["inputDirection", "inputJingWell", "inputNext"];
            const answers = ["ansDirection", "ansJingWell", "ansNext"];
            
            inputs.forEach(id => {
                const el = document.getElementById(id);
                el.value = "";
                el.className = ""; 
                el.disabled = false; 
            });
            
            answers.forEach(id => {
                document.getElementById(id).style.display = "none";
            });

            document.getElementById("feedback").textContent = "";
            document.getElementById("submitBtn").style.display = "block";
            document.getElementById("nextBtn").style.display = "none";
        }

        // 3. 對答案邏輯
        function checkAnswers() {
            const userDir = cleanString(document.getElementById("inputDirection").value);
            const userJing = cleanString(document.getElementById("inputJingWell").value);
            const userNext = cleanString(document.getElementById("inputNext").value);

            let allCorrect = true;

            // 檢查「走向」
            if (userDir === currentMeridian.direction) {
                document.getElementById("inputDirection").classList.add("correct");
            } else {
                document.getElementById("inputDirection").classList.add("wrong");
                document.getElementById("ansDirection").textContent = `正確答案：${currentMeridian.direction}`;
                document.getElementById("ansDirection").style.display = "block";
                allCorrect = false;
            }

            // 檢查「井穴」
            if (userJing === currentMeridian.jingWell) {
                document.getElementById("inputJingWell").classList.add("correct");
            } else {
                document.getElementById("inputJingWell").classList.add("wrong");
                document.getElementById("ansJingWell").textContent = `正確答案：${currentMeridian.jingWell}`;
                document.getElementById("ansJingWell").style.display = "block";
                allCorrect = false;
            }

            // 檢查「交接經脈」
            if (currentMeridian.next.includes(userNext) && userNext.length >= 3) {
                document.getElementById("inputNext").classList.add("correct");
            } else {
                document.getElementById("inputNext").classList.add("wrong");
                document.getElementById("ansNext").textContent = `正確答案：${currentMeridian.next}`;
                document.getElementById("ansNext").style.display = "block";
                allCorrect = false;
            }

            const feedbackEl = document.getElementById("feedback");
            if (allCorrect) {
                feedbackEl.textContent = "✅ 導航數據完全正確！";
                feedbackEl.style.color = "#27ae60";
            } else {
                feedbackEl.textContent = "❌ 空間定位有誤，請複習紅色標示處。";
                feedbackEl.style.color = "#e74c3c";
            }

            document.getElementById("inputDirection").disabled = true;
            document.getElementById("inputJingWell").disabled = true;
            document.getElementById("inputNext").disabled = true;
            document.getElementById("submitBtn").style.display = "none";
            document.getElementById("nextBtn").style.display = "block";
        }

        window.onload = loadMeridian;
    </script>
</body>
</html>
