        let activePool = [...summaryBank];

        function setWeek(week, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activePool = week === '全部' ? [...summaryBank] : summaryBank.filter(x => x.week === week);
            currentIndex = 0;
            loadNext();
        }

        function shuffle(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function loadNext() {
            const item = activePool[currentIndex % activePool.length];
            currentIndex++;
            selectedAns = [null, null];

            document.getElementById('progressText').textContent = `第 ${((currentIndex - 1) % activePool.length) + 1} / ${activePool.length} 題`;
            document.getElementById('weekTag').textContent = `${item.week}・關鍵表現（主症／舌脈）`;
            document.getElementById('clueText').textContent = item.clue;

            const container = document.getElementById('stepsContainer');
            container.innerHTML = '';

            item.steps.forEach((st, sIdx) => {
                const div = document.createElement('div');
                div.className = 'step-box';
                div.innerHTML = `<div class="step-label">${st.q}</div>`;

                const opts = shuffle(st.opts.map((text, idx) => ({ text, isCorrect: idx === st.ans })));
                opts.forEach(op => {
                    const btn = document.createElement('button');
                    btn.className = 'opt-btn';
                    btn.textContent = op.text;
                    btn.dataset.step = sIdx;
                    btn.dataset.correct = op.isCorrect;
                    btn.onclick = () => {
                        selectedAns[sIdx] = op.isCorrect;
                        div.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                    };
                    div.appendChild(btn);
                });
                container.appendChild(div);
            });

            document.getElementById('detailBox').style.display = 'none';
            document.getElementById('checkBtn').style.display = 'block';
            document.getElementById('nextBtn').style.display = 'none';
        }

        function checkAnswer() {
            const item = activePool[(currentIndex - 1) % activePool.length];
            item.steps.forEach((st, sIdx) => {
                const btns = document.querySelectorAll(`.opt-btn[data-step="${sIdx}"]`);
                btns.forEach(b => {
                    b.disabled = true;
                    const isCorrect = b.dataset.correct === 'true';
                    if (isCorrect) {
                        b.classList.add('correct');
                    } else if (b.classList.contains('selected')) {
                        b.classList.add('wrong');
                    }
                });
            });

            const box = document.getElementById('detailBox');
            box.innerHTML = `<strong>📌 完整對照（${item.name}）：</strong><br>${item.detail}`;
