        function setCategory(cat, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activePool = cat === '全部' ? [...zangfuBank] : zangfuBank.filter(item => item.cat === cat);
            loadQuestion();
        }

        function shuffle(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function loadQuestion() {
            if (activePool.length === 0) activePool = [...zangfuBank];
            const idx = Math.floor(Math.random() * activePool.length);
            currentQ = activePool[idx];

            document.getElementById('questionText').textContent = `[${currentQ.cat}] ${currentQ.q}`;
            document.getElementById('explainBox').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';

            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            const indexedOpts = currentQ.options.map((text, i) => ({ text, isCorrect: i === currentQ.ans }));
            shuffle(indexedOpts).forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt.text;
                btn.onclick = () => selectOption(btn, opt.isCorrect);
                container.appendChild(btn);
            });
        }

        function selectOption(clickedBtn, isCorrect) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            totalAnswered++;
            if (isCorrect) {
                clickedBtn.classList.add('correct');
                correctCount++;
            } else {
                clickedBtn.classList.add('wrong');
            }

            document.getElementById('scoreText').textContent = `答對：${correctCount} / ${totalAnswered}`;
            const expBox = document.getElementById('explainBox');
            expBox.innerHTML = `<strong>💡 辨析重點：</strong>${currentQ.exp}`;
            expBox.style.display = 'block';
            document.getElementById('nextBtn').style.display = 'block';
        }
