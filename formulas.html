        let deck = [];
        let completedCount = 0;

        function shuffleDeck() {
            deck = [...formulaDatabase];
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
            completedCount = 0;
        }

        function loadNextFormula() {
            if (deck.length === 0) {
                shuffleDeck();
            }
            const current = deck.pop();
            completedCount++;

            document.getElementById("progressText").textContent = `${completedCount} / ${formulaDatabase.length}`;
            document.getElementById("formulaImg").src = current.image;
            document.getElementById("formulaImg").alt = current.name;
            document.getElementById("symptomText").textContent = current.symptoms;

            document.getElementById("formulaCategory").textContent = `📚 ${current.category}`;
            document.getElementById("formulaName").textContent = current.name;
            document.getElementById("formulaIngredients").textContent = current.ingredients;
            document.getElementById("formulaFunction").textContent = current.func;
            document.getElementById("formulaLogic").textContent = current.logic;
            document.getElementById("formulaUsage").textContent = current.usage;

            document.getElementById("promptText").style.display = "block";
            document.getElementById("answerBox").style.display = "none";
            document.getElementById("revealBtn").style.display = "block";
            document.getElementById("nextBtn").style.display = "none";
        }

        function revealAnswer() {
            document.getElementById("promptText").style.display = "none";
            document.getElementById("answerBox").style.display = "block";
            document.getElementById("revealBtn").style.display = "none";
            document.getElementById("nextBtn").style.display = "block";
        }

        window.onload = loadNextFormula;
    </script>
