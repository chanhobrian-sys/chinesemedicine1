<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方劑圖像記憶特訓</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 92%;
            max-width: 500px;
            text-align: center;
        }
        h1 {
            font-size: 1rem;
            color: #7f8c8d;
            margin: 0 0 15px 0;
        }
        .image-box {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            margin-bottom: 18px;
            cursor: pointer;
            background-color: #eef2f5;
        }
        .image-box img {
            width: 100%;
            height: auto;
            display: block;
        }
        .prompt-text {
            font-size: 0.95rem;
            color: #7f8c8d;
            margin-bottom: 18px;
        }
        .answer-box {
            display: none;
            text-align: left;
            background-color: #fdfaf5;
            border-left: 5px solid #e67e22;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 18px;
            line-height: 1.6;
        }
        .formula-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #d35400;
            margin: 0 0 10px 0;
        }
        .info-row {
            margin-bottom: 8px;
            font-size: 0.98rem;
            color: #2c3e50;
        }
        .info-row:last-child {
            margin-bottom: 0;
        }
        .info-label {
            font-weight: bold;
            color: #8e44ad;
        }
